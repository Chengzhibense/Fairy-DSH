# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: danger-full-access

- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: !!js process.env.DSH_FAIRY_REPO_ROOT +
          '/browser-dock/dsh-browser-dock/proxy.cjs'
        args:
          - '--browser'
          - !!js "process.env.DSH_FAIRY_BROWSER || (process.platform === 'win32' ? 'msedge'
            : 'chrome')"
          - '--headless'
          - '--user-data-dir'
          - !!js process.env.DSH_FAIRY_TEST_HOME + '/playwright-profile'
        env:
          DSH_HOME: !!js process.env.DSH_HOME || ((process.env.USERPROFILE ||
            process.env.HOME) + '/.dsh')
          DSH_FAIRY_PROFILE_ROOT: !!js process.env.DSH_FAIRY_PROFILE_ROOT ||
            (((process.env.DSH_HOME || ((process.env.USERPROFILE ||
            process.env.HOME) + '/.dsh'))) + '/profiles/web')

    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: stdio
        command: !!js process.env.DSH_FAIRY_PROFILE_ROOT + '/node_modules/.bin/context7-mcp'
        args: []

    - id: balance-meter
      name: 'dsh-balance-meter'
      inject: [ clientModules ]

    - id: browser-dock
      name: 'dsh-browser-dock'
      inject: [ clientModules ]

    - id: fairy-startup
      name: 'dsh-fairy-startup'
      inject: [ clientModules ]

    - id: fairy-voice
      name: 'dsh-fairy-voice'
      inject: [ clientModules ]

    - id: fairy-visual
      name: 'dsh-fairy-visual'
      inject: [ clientModules ]
